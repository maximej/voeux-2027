<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ecfee4">
  <title>PAIX en blocs</title>
  <meta name="description" content="Construisez le mot PAIX avec ses morceaux qui tombent.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="is-loading">
  <header class="bar">
    <p class="hint" id="hint" aria-live="polite"></p>
    <p class="message" id="message" hidden aria-live="polite"></p>
  </header>

  <main class="frame">
    <div id="stage" class="stage">
      <canvas id="board" class="board" aria-label="Plateau de jeu"></canvas>
    </div>
  </main>

  <footer class="bar">
    <canvas id="next" class="next" aria-label="Pièce suivante"></canvas>
    <button class="replay" id="replay" type="button" hidden>Rejouer</button>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
