<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ecfee4">
  <title>Vœux 2027</title>
  <meta name="description" content="Quatre petits jeux pour les vœux 2027.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Anciens liens vers la carte « Relie les points » (?d=, ?msg=, ?n=) : on les envoie vers /points/
    if (/[?&](d|msg|n)=/.test(location.search)) location.replace('points/' + location.search);
  </script>
  <style>
    /* Charte commune (inspirée de Monument Valley) : fond clair en dégradé pastel, encre indigo,
       violet du crépuscule et bleu-vert des montagnes en néon, avec halo ; police du système */
    :root {
      --ink: #383f52;
      --violet: #6c60a9;
      --violet-rgb: 108 96 169;
      --teal: #51acad;
      --teal-rgb: 81 172 173;
      --teal-deep: #32717b; /* montagnes de MV4 : survol et texte lisible */
      --bg: radial-gradient(120% 90% at 50% 28%, #f4feee 0%, #ecfee4 30%, #d8ede1 62%, #dabdd0 100%);
      --glow-rgb: 249 249 154; /* lanternes et soleil */
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { background: #d8ede1; }
    body {
      display: grid;
      place-content: center;
      gap: 40px;
      min-height: 100dvh;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font: 500 16px/1.3 var(--font);
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    h1 {
      margin: 0;
      color: var(--violet);
      font-size: clamp(2rem, 9vmin, 3.5rem);
      font-weight: 800;
      text-shadow: 0 0 2px rgb(var(--violet-rgb) / .45), 0 0 12px rgb(var(--violet-rgb) / .4), 0 0 30px rgb(var(--violet-rgb) / .25);
    }
    ul { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
    a {
      display: block;
      min-width: min(320px, 80vw);
      padding: 16px 24px;
      border: 2px solid var(--teal);
      background: rgb(244 254 238 / .6);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .1em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgb(var(--teal-rgb) / .35), inset 0 0 8px rgb(var(--teal-rgb) / .2);
    }
    a:hover, a:focus-visible {
      background: var(--teal-deep);
      color: #f4feee;
      box-shadow: 0 0 6px rgb(var(--teal-rgb) / .6), 0 0 24px rgb(var(--teal-rgb) / .45);
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Vœux 2027</h1>
  <ul>
    <li><a href="points/">Relie les points</a></li>
    <li><a href="paxel/">Grattez l’image</a></li>
    <li><a href="tetris/">PAIX en blocs</a></li>
    <li><a href="boule-a-neige/">Boule à neige</a></li>
  </ul>
</body>
</html>
