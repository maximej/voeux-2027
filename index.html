<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <title>Vœux 2027</title>
  <meta name="description" content="Trois petits jeux pour les vœux 2027.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Anciens liens vers la carte « Relie les points » (?d=, ?msg=, ?n=) : on les envoie vers /points/
    if (/[?&](d|msg|n)=/.test(location.search)) location.replace('points/' + location.search);
  </script>
  <style>
    /* Charte commune : néon blanc à halo orange, fond presque noir, police du système */
    :root {
      --bg: #08080b;
      --white: #fffaf4;
      --orange: #ff8a1f;
      --orange-rgb: 255 138 31;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-content: center;
      gap: 40px;
      min-height: 100dvh;
      padding: 24px;
      background: var(--bg);
      color: var(--white);
      font: 500 16px/1.3 var(--font);
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 9vmin, 3.5rem);
      font-weight: 800;
      text-shadow: 0 0 4px rgb(var(--orange-rgb) / .9), 0 0 14px rgb(var(--orange-rgb) / .7), 0 0 32px rgb(var(--orange-rgb) / .45);
    }
    ul { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
    a {
      display: block;
      min-width: min(320px, 80vw);
      padding: 16px 24px;
      border: 2px solid var(--orange);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .1em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgb(var(--orange-rgb) / .5), inset 0 0 8px rgb(var(--orange-rgb) / .35);
      text-shadow: 0 0 6px rgb(var(--orange-rgb) / .8);
    }
    a:hover, a:focus-visible {
      background: var(--orange);
      color: var(--bg);
      text-shadow: none;
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Vœux 2027</h1>
  <ul>
    <li><a href="points/">Relie les points</a></li>
    <li><a href="paxel/">Grattez l’image</a></li>
    <li><a href="tetris/">PAIX en blocs</a></li>
  </ul>
</body>
</html>
