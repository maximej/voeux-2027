<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="nsapin-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Seuls les éléments marqués data-dots deviennent des points : le reste est du décor révélé à la fin -->
  <g fill="#70ff36" fill-opacity=".1" stroke="#70ff36" stroke-width="5" stroke-linejoin="round" filter="url(#nsapin-glow)">
    <polygon id="nsapin-a" data-dots="auto"
      points="100,20 140,70 120,70 155,115 130,115 170,160 112,160 112,185 88,185 88,160 30,160 70,115 45,115 80,70 60,70"/>
  </g>
  <g filter="url(#nsapin-glow)">
    <use href="#nsapin-a" fill="none" stroke="#fff" stroke-width="1.6"/>
    <rect x="91" y="161" width="18" height="21" fill="#ff7a1a" fill-opacity=".35"/>
    <path d="M72 95 Q100 108 128 92 M58 140 Q100 155 145 136" fill="none" stroke="#1de3ff" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke-width="3">
      <circle cx="90" cy="60" r="5" stroke="#ff2fbc"/>
      <circle cx="115" cy="85" r="5" stroke="#f4f749"/>
      <circle cx="80" cy="125" r="5" stroke="#8b4dff"/>
      <circle cx="125" cy="130" r="5" stroke="#ff2fbc"/>
    </g>
    <polygon fill="#f4f749" points="100,4 104,13 114,14 106,20 109,30 100,24 91,30 94,20 86,14 96,13"/>
  </g>
</svg>
