<body class="is-loading">
  <header class="bar">
    <p class="hint" id="hint"></p>
  </header>

  <main class="frame">
    <div id="stage" class="stage"></div>
  </main>

  <footer class="bar">
    <button class="button" id="random" type="button">Au hasard</button>
    <button class="button" id="share" type="button">Partager</button>
    <button class="button" id="motion" type="button" hidden>Activer le mouvement</button>
  </footer>

  <dialog class="picker" id="picker" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 class="picker-title" id="picker-title"></h2>
      <button class="picker-close" type="button" aria-label="Fermer">×</button>
    </div>
